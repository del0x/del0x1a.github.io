{% extends "base.html" %}
{% block content %}
<main>
  <article class="panel">
    <h2>All Notes</h2>
    <div>
      <ul class="notes-list">
        {% for note in notes %}
          <li>
            <a href="/{{ note.url }}">{{ note.title.replace("_", " ") }}</a>
            <small>({{ note.date_str }})</small>
          </li>
        {% endfor %}
      </ul>
    </div>
  </article>
</main>
{% endblock %}
