{% extends "base.html" %}
{% block content %}
<main>
  <article>
    <h2>Death Clock</h2>

    <div class="panel clock-panel">
      <img src="images/sad_cat1.jpg" alt="sad cat" class="clock-cat">
      <div id="timer"></div>
    </div>

  </article>
</main>

<style>
  .clock-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
  }

  .clock-cat {
    width: 100%;
    max-width: 320px;
    border-radius: 4px;
    display: block;
  }

  #timer {
    font-family: "Geist Mono", monospace;
    font-size: 1.4rem;
    color: var(--highlight);
    letter-spacing: 2px;
    text-align: center;
  }
</style>

<script src="js/clock.js"></script>
{% endblock %}
